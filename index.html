<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>출첵 CHULCHEK · 실시간 QR 출결</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#12151b; --ink2:#1b202a; --paper:#eef1f5; --card:#ffffff; --line:#e3e7ec;
  --text:#171b22; --muted:#727a86; --brand:#3b5bff; --present:#12b886;
  --expire:#ff5a3c; --amber:#ffb020;
}
*{box-sizing:border-box}
body{margin:0}
.app{font-family:'Pretendard',system-ui,sans-serif;background:
  radial-gradient(1200px 600px at 80% -10%, #dfe6ff 0%, transparent 55%),
  var(--paper);min-height:100vh;color:var(--text);padding:18px;-webkit-font-smoothing:antialiased}
i[data-lucide]{width:1em;height:1em;display:inline-block;vertical-align:-.125em}
.qr-svg{display:block}

/* topbar */
.topbar{max-width:1120px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#6b5bff);
  color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(59,91,255,.32);font-size:20px}
.brand-name{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px}
.brand-sub{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.14em}
.brand-tag{font-size:12.5px;color:var(--muted);margin-top:1px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;box-shadow:0 2px 8px rgba(20,30,60,.05)}
.seg-btn{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted);
  display:flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit;transition:.16s}
.seg-btn.on{background:var(--ink);color:#fff}

/* 행사 유형 선택 */
.type-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.type-label{font-size:12.5px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.type-seg{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.type-btn{flex:1;min-width:150px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-family:inherit;
  font-weight:800;font-size:13.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:7px;flex-wrap:wrap;transition:.15s;text-align:left}
.type-btn span{flex-basis:100%;font-size:11px;font-weight:600;color:var(--muted)}
.type-btn i{color:var(--muted)}
.type-btn.on{border-color:var(--brand);background:#f3f6ff;box-shadow:0 0 0 3px rgba(59,91,255,.1)}
.type-btn.on i{color:var(--brand)}
.type-btn.on span{color:#4a63c9}
.stat-grid.sg-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.stat-grid.sg-3{grid-template-columns:repeat(2,1fr)}}
.sub-stats.ss-2{grid-template-columns:repeat(2,1fr)}

/* 사전 안내문자 카드 */.prenotify{border:1px solid #dbe4ff;background:linear-gradient(180deg,#f5f8ff,#eef3ff);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.prenotify.pn-sent{border-color:#c9ead9;background:linear-gradient(180deg,#f2fdf8,#ecfbf4)}
.pn-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pn-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.pn-title i{color:var(--brand)}
.pn-sent .pn-title i{color:var(--present)}
.pn-badge{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.b-sched{background:rgba(59,91,255,.12);color:#2b45d6}
.b-sent{background:rgba(18,184,134,.14);color:#0c8f68}
.pn-meta{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.pn-meta strong{color:var(--text)}
.pn-msg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.5;color:#4a525e;margin-bottom:10px}
.prenotify .btn{width:100%;justify-content:center}

/* 참여율 배너 */.rate-banner{background:linear-gradient(135deg,#12151b,#1c2333);border-radius:16px;padding:16px 18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.rate-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.rate-label{font-size:12.5px;font-weight:700;color:#aab4c6;letter-spacing:.02em}
.rate-count{font-size:12.5px;font-weight:700;color:#e6ebf3}
.rate-big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.rate-big span{font-size:22px;margin-left:3px;color:#9fb0ff}
.rate-bar{height:9px;background:rgba(255,255,255,.12);border-radius:20px;overflow:hidden;margin-top:8px}
.rate-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--present),#3ce0a8);transition:width .6s cubic-bezier(.2,.7,.2,1)}

/* 미출석 리마인드 바 */
.absent-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff7f4;border:1px solid #ffdcd0;border-radius:14px;padding:11px 14px;margin-bottom:12px}
.ab-info{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#b5432a}
.ab-info i{color:var(--expire)}
.btn.warn{background:var(--expire);color:#fff;box-shadow:0 4px 12px rgba(255,90,60,.28)}
.btn.warn:hover{filter:brightness(1.05)}
.btn.warn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.td-phone{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.pill-sent{background:rgba(255,90,60,.12);color:#d63c1e;display:inline-flex;align-items:center;gap:3px;margin-left:6px}

/* 모달 */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,20,30,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:18px;animation:fade .2s ease}
.modal{width:460px;max-width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 70px rgba(10,15,30,.4);animation:qrpop .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.modal-head h3{margin:0;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.modal-x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px;display:grid;place-items:center;font-size:20px}
.modal-x:hover{color:var(--text)}
.modal-body{padding:4px 20px 8px;display:flex;flex-direction:column;gap:12px}
.modal-recip{background:#f6f8fa;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.mr-count{font-size:13px;font-weight:700}
.mr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mr-chip{font-size:11.5px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--text)}
.mr-chip.more{background:#eef0f3;color:var(--muted)}
.modal-label{font-size:12.5px;font-weight:700}
.modal-label span{color:var(--muted);font-weight:500}
.modal-textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:13px;line-height:1.55;resize:vertical;outline:none}
.modal-textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,91,255,.12)}
.modal-preview{background:#f0f4ff;border:1px solid #dbe4ff;border-radius:12px;padding:11px 13px}
.mp-label{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.04em}
.mp-bubble{margin-top:6px;background:#fff;border-radius:12px 12px 12px 4px;padding:10px 13px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;box-shadow:0 2px 6px rgba(20,30,60,.06)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line);margin-top:4px}

/* ADMIN layout */
.admin{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px}
@media(max-width:900px){.admin{grid-template-columns:1fr}}

/* stage */
.stage{background:linear-gradient(180deg,#171c26,#0f131a);border-radius:20px;padding:18px;color:#e8ecf3;
  border:1px solid #262d3a;box-shadow:0 20px 50px rgba(10,15,30,.35)}
.stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:#ff6f59;
  background:rgba(255,90,60,.12);padding:5px 10px;border-radius:20px}
.live i{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.mode-toggle{display:flex;gap:4px;background:#0c1017;border:1px solid #262d3a;border-radius:10px;padding:3px}
.mt-btn{border:0;background:transparent;color:#9aa4b4;font-weight:700;font-size:12.5px;padding:7px 11px;border-radius:8px;
  display:flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit;transition:.15s}
.mt-btn.on-in{background:var(--present);color:#03271c}
.mt-btn.on-out{background:var(--brand);color:#fff}

.stage-body{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0 4px}
.qr-frame{position:relative;padding:14px;background:#fff;border-radius:20px;box-shadow:0 0 0 6px rgba(255,255,255,.06), 0 14px 40px rgba(0,0,0,.4);
  animation:qrpop .45s ease}
@keyframes qrpop{0%{transform:scale(.96);opacity:.5}100%{transform:scale(1);opacity:1}}
.qr-refresh{position:absolute;top:-11px;right:10px;background:var(--amber);color:#3a2600;font-size:10.5px;font-weight:800;
  padding:3px 8px;border-radius:20px;display:flex;align-items:center;gap:4px}
.stage-meta{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.chk-badge{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:15px;padding:8px 16px;border-radius:12px}
.b-in{background:rgba(18,184,134,.16);color:#3ce0a8}
.b-out{background:rgba(59,91,255,.18);color:#9fb0ff}
.token-line{display:flex;align-items:center;gap:9px}
.tk-label{font-size:11px;letter-spacing:.16em;color:#7c8698;font-weight:700}
.tk-code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:.18em;color:#fff}
.cd-line{display:flex;align-items:center;gap:14px;background:#0c1017;border:1px solid #232a37;border-radius:14px;padding:10px 16px;width:100%;justify-content:center}
.ring-wrap{position:relative;width:64px;height:64px;display:grid;place-items:center}
.ring-num{position:absolute;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:#fff}
.cd-text{font-size:13px;color:#c4ccd8;font-weight:600;line-height:1.5}
.cd-text strong{color:#fff}
.cd-text span{display:block;font-size:11px;color:#7c8698;font-weight:500}

.stage-foot{display:flex;flex-direction:column;gap:8px;margin-top:16px;border-top:1px solid #262d3a;padding-top:14px}
.sf-item{display:flex;align-items:center;gap:9px;font-size:13px;color:#aeb7c5;font-weight:600}
.sf-item i{color:var(--present);flex:none}

/* dashboard */
.dash{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(20,30,60,.06)}
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.dash-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.dash-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.dash-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;font-family:inherit;font-weight:700;font-size:13px;padding:9px 13px;border-radius:10px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.15s}
.btn.ghost{background:#f1f3f6;color:var(--text)}
.btn.ghost:hover{background:#e7eaef}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(59,91,255,.28)}
.btn.primary:hover{filter:brightness(1.06)}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:520px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fbfcfd}
.stat-top{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:700}
.stat-value{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat-present .stat-value,.stat-present .stat-top{color:var(--present)}
.stat-brand .stat-value,.stat-brand .stat-top{color:var(--brand)}
.stat-muted .stat-value{color:var(--muted)}
.stat-ink .stat-value{color:var(--ink)}

.table-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.attn-table{width:100%;border-collapse:collapse;font-size:13.5px}
.attn-table thead th{text-align:left;background:#f6f8fa;color:var(--muted);font-weight:700;font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.attn-table td{padding:10px 14px;border-bottom:1px solid #eef1f4}
.attn-table tbody tr:last-child td{border-bottom:0}
.row-absent{background:#fcfcfd}
.who{display:flex;flex-direction:column}
.who-name{font-weight:700}
.who-id{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.td-dept{color:var(--muted)}
.td-time{font-variant-numeric:tabular-nums;font-weight:600}
.pill{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill-in{background:rgba(18,184,134,.14);color:#0c8f68}
.pill-out{background:rgba(59,91,255,.13);color:#2b45d6}
.pill-absent{background:#eef0f3;color:#8a929e}

.pitch-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ps-item{text-align:center;background:linear-gradient(180deg,#f3f6ff,#eef2ff);border:1px solid #dfe6ff;border-radius:14px;padding:12px}
.ps-item strong{display:block;font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.02em}
.ps-item span{font-size:11.5px;color:var(--muted);font-weight:600}

/* EMPLOYEE */
.emp{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.persona-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pb-label{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.pb-chip{border:1px solid var(--line);background:#fff;color:var(--text);font-family:inherit;font-weight:700;font-size:12.5px;
  padding:6px 11px;border-radius:20px;cursor:pointer;transition:.15s}
.pb-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.phone{width:330px;max-width:92vw;background:#0d0f14;border-radius:38px;padding:12px;box-shadow:0 24px 60px rgba(10,15,30,.35);position:relative}
.phone-notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#0d0f14;border-radius:0 0 16px 16px;z-index:2}
.phone-screen{background:linear-gradient(180deg,#ffffff,#f7f9fc);border-radius:28px;min-height:520px;padding:16px;overflow:hidden;position:relative}
.pscr-head{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-bottom:8px}
.pscr-brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.pscr-ev{font-size:11.5px;color:var(--muted);font-weight:600}
.pstep{display:flex;flex-direction:column;align-items:center;gap:11px;padding:10px 4px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pstep h3{margin:6px 0 0;font-size:17px;font-weight:800;text-align:center}
.pstep-sub{margin:0;font-size:12.5px;color:var(--muted);text-align:center}

.scan-vp{width:190px;height:190px;border-radius:22px;background:linear-gradient(135deg,#11151d,#1c2230);position:relative;
  display:grid;place-items:center;margin-top:6px;overflow:hidden;color:rgba(255,255,255,.14);font-size:54px}
.scan-corners i{position:absolute;width:26px;height:26px;border:3px solid var(--present)}
.scan-corners i:nth-child(1){top:14px;left:14px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.scan-corners i:nth-child(2){top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.scan-corners i:nth-child(3){bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.scan-corners i:nth-child(4){bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.scan-line{position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(90deg,transparent,var(--present),transparent);
  top:20px;animation:scanmove 2s ease-in-out infinite}
@keyframes scanmove{0%,100%{top:20px}50%{top:168px}}

.pbtn{width:100%;border:0;font-family:inherit;font-weight:800;font-size:14.5px;padding:13px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.15s}
.pbtn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(59,91,255,.3)}
.pbtn.primary-out{background:var(--present);color:#fff;box-shadow:0 6px 16px rgba(18,184,134,.3)}
.pbtn.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.pbtn.primary:not(:disabled):hover{filter:brightness(1.06)}
.pbtn.subtle{background:transparent;color:var(--muted);font-size:12.5px;padding:8px}

.scanned-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px}
.st-in{background:rgba(18,184,134,.14);color:#0c8f68}
.st-out{background:rgba(59,91,255,.13);color:#2b45d6}

.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:12px;font-family:inherit;font-weight:700;font-size:14px;color:#3c4043;cursor:pointer;transition:.15s}
.google-btn:hover{background:#f8f9fb}
.google-btn.done{border-color:var(--present);background:#f2fdf9}
.gb-acc{display:flex;align-items:center;gap:6px;font-size:13px}
.gb-ok{color:var(--present)}

.field{width:100%;display:flex;flex-direction:column;gap:5px;transition:.2s}
.field-off{opacity:.4}
.field label{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--text)}
.field input{border:1.5px solid var(--line);border-radius:11px;padding:12px;font-family:inherit;font-size:14px;font-weight:600;
  letter-spacing:.04em;outline:none;transition:.15s}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,91,255,.12)}
.field input:disabled{background:#f4f6f8}
.field-hint{font-size:11px;color:var(--muted)}

.pnote{width:100%;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:11px 13px;border-radius:11px;line-height:1.4}
.pnote.err{background:rgba(255,90,60,.1);color:#d63c1e}
.pnote i{flex:none}

.confirm-card{width:100%;background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.crow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #e3e7ec;font-size:13px}
.crow:last-child{border-bottom:0}
.crow-k{color:var(--muted);font-weight:600;flex:none}
.crow-v{font-weight:700;text-align:right}

.done-step{padding-top:26px;gap:8px}

/* ============================================================================
   운영자 앱

function runOperator(){
  const st = { adminMode:"in", eventType:"training", roster:ROSTER.map(r=>({...r})),
    attendance:{}, submissions:{}, preNotify:"scheduled", smsSent:new Set(), lastWindow:null };
  window.__ck = st;

  if(configured){
    db.ref(DBROOT+"/event").on("value",s=>{ curEvent=Object.assign({}, EV, s.val()||{}); renderOp(); });
    db.ref(DBROOT+"/mode").on("value",s=>{ const m=s.val(); if((m==="in"||m==="out")&&m!==st.adminMode){ st.adminMode=m; renderOp(); } });
    db.ref(DBROOT+"/roster").on("value",s=>{ const r=s.val(); const arr=Array.isArray(r)?r:(r&&typeof r==="object"?Object.values(r):[]); if(arr.length){ st.roster=arr; renderOp(); } });
    db.ref(DBROOT+"/attendance").on("value",s=>{ st.attendance=s.val()||{}; renderOp(); });
    db.ref(DBROOT+"/submissions").on("value",s=>{ st.submissions=s.val()||{}; renderOp(); });
  }

  function attVals(){ return Object.values(st.attendance); }
  function rosterPresent(){ const v=attVals(); return st.roster.filter(r=>v.some(a=>a.empId===r.empId)).length; }
  function stats(){
    const present=Object.keys(st.attendance).length;
    const out=attVals().filter(a=>a.checkOutAt).length;
    const total=st.roster.length;
    const rate=total?Math.min(100,Math.round(present/total*100)):0;
    return { present, out, total, rate, absent: Math.max(0,total-rosterPresent()) };
  }
  function opRows(){
    const v=attVals();
    const rows = st.roster.map(r=>{ const a=v.find(x=>x.empId===r.empId);
      return {...r, guest:false, uid:a?a.uid:null, checkInAt:a?a.checkInAt:null, checkOutAt:a?a.checkOutAt:null}; });
    v.forEach(a=>{ if(!st.roster.find(r=>r.empId===a.empId)){
      rows.push({empId:a.empId||"—",name:a.name||a.email||"게스트",dept:"게스트",phone:"",guest:true,uid:a.uid,checkInAt:a.checkInAt,checkOutAt:a.checkOutAt}); } });
    return rows.sort((a,b)=>(b.checkInAt||0)-(a.checkInAt||0));
  }
  function subStats(){
    const present=Object.keys(st.attendance).length;
    const subs=Object.values(st.submissions); const n=subs.length;
    const avg=n?(subs.reduce((s,x)=>s+(x.rating||0),0)/n):0;
    const qGot=subs.reduce((s,x)=>s+(x.quizScore||0),0), qMax=subs.reduce((s,x)=>s+(x.quizTotal||0),0);
    const qPct=qMax?Math.round(qGot/qMax*100):0;
    const assignN=subs.filter(x=>x.assignment||x.fileName).length;
    return { present, n, subRate:present?Math.round(n/present*100):0, avg, qPct, assignN };
  }
  function checkinUrl(){
    const w=windowOf(Date.now()), code=tokenCode(EVENTID+"|"+st.adminMode+"|"+w);
    return baseUrl()+"?c=1&w="+w+"&t="+code+"&m="+st.adminMode+"&ty="+st.eventType;
  }

  function renderOp(){
    const app=document.getElementById("app");
    if(!configured){ app.innerHTML=cfgBanner(); refreshIcons(); return; }
    const s=stats(), rows=opRows(), ss=subStats(), isTrain=st.eventType==="training";
    const now=Date.now(), sl=secondsLeft(now), url=checkinUrl();

    const trows = rows.map(r=>{

        :(r.checkInAt?'<span class="pill pill-nosub">미제출</span>':'<span class="td-dash">—</span>');
      const nameCell='<div class="who"><span class="who-name">'+esc(r.name)+(r.guest?' <span class="guest-tag">게스트</span>':'')+'</span><span class="who-id">'+esc(r.empId)+'</span></div>';
      return '<tr class="'+(status==="absent"?"row-absent":"")+'"><td>'+nameCell+'</td><td class="td-dept">'+esc(r.dept)+'</td>'+

        '<td><span class="pill pill-'+status+'">'+label+'</span></td><td>'+subCell+'</td></tr>';

    const attV=attVals();

    const absentBar = absentRoster.length>0 ?
      '<div class="absent-bar"><span class="ab-info">'+ic("clock")+' 명단 미출석 <strong>'+absentRoster.length+'명</strong> · 리마인드 발송</span>'+

      subCard("star",(ss.n?ss.avg.toFixed(1):"—"),"평균 만족도")+'</div></div>';

      '<span class="pn-badge '+(preSent?"b-sent":"b-sched")+'">'+(preSent?ic("check-circle-2")+" 발송완료":ic("clock")+" 예약됨")+'</span></div>'+
      '<div class="pn-meta">전체 <strong>'+s.total+'명</strong> · 발송예정 <strong>'+preNotifyTime()+'</strong> (자동)</div>'+

    const dash='<section class="dash">'+

        '<button class="type-btn '+(isTrain?"on":"")+'" data-type="training">'+ic("graduation-cap")+' 교육형<span>출석+퇴실 · 과제·퀴즈·만족도</span></button>'+
        '<button class="type-btn '+(!isTrain?"on":"")+'" data-type="general">'+ic("party-popper")+' 일반 행사형<span>출석만 · 만족도 조사만</span></button></div></div>'+
      '<div class="dash-head"><div><h2>'+esc(curEvent.name)+' <button class="edit-evt" id="btnEditEvent" title="행사 정보 수정">'+ic("pencil")+'</button></h2><p>'+esc(curEvent.date)+' · '+esc(curEvent.time)+' · '+esc(curEvent.place)+'</p></div>'+

  function wireOp(){
    document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{st.adminMode=b.dataset.mode;db.ref(DBROOT+"/mode").set(st.adminMode).catch(()=>{});renderOp();});
    document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{st.eventType=b.dataset.type;if(st.eventType==="general"){st.adminMode="in";db.ref(DBROOT+"/mode").set("in").catch(()=>{});}renderOp();});
    const up=document.getElementById("btnUpload"), fi=document.getElementById("fileInput");
    if(up&&fi){ up.onclick=()=>fi.click(); fi.onchange=handleUpload; }
    const rs=document.getElementById("btnReset");
    if(rs)rs.onclick=()=>{ if(!confirm("모든 체크인 기록을 초기화할까요?"))return;
      db.ref(DBROOT+"/attendance").remove(); db.ref(DBROOT+"/submissions").remove();
      st.preNotify="scheduled"; st.smsSent=new Set(); toast("info","초기화했어요."); };
    const ex=document.getElementById("btnExport"); if(ex)ex.onclick=exportExcel;
    const scr=document.getElementById("btnScreen"); if(scr)scr.onclick=()=>window.open(baseUrl()+"?screen=1","_blank");
    const ee=document.getElementById("btnEditEvent"); if(ee)ee.onclick=openEditEvent;
    const pre=document.getElementById("btnPre"); if(pre)pre.onclick=()=>{st.preNotify="sent";renderOp();toast("success","전체 "+st.roster.length+"명에게 시작 안내문자를 발송했어요.");};
    const sms=document.getElementById("btnSms"); if(sms)sms.onclick=openSms;
  }

  async function handleUpload(ev){
    const file=ev.target.files&&ev.target.files[0]; if(!file)return;
    if(!window.XLSX){toast("error","엑셀 모듈 로드 실패. 인터넷 확인.");ev.target.value="";return;}
    try{
      const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const norm=s=>String(s).replace(/[\s()*·.,\-_/\[\]]/g,"").toLowerCase();
      const pick=(o,ks)=>{ const set=ks.map(norm); for(const k of Object.keys(o)){ if(set.includes(norm(k))&&o[k]!=null&&o[k]!=="")return String(o[k]).trim(); } return""; };
      const list=raw.map(o=>({empId:pick(o,["사번","사번(*)","사원번호","empId","id","ID"]),name:pick(o,["이름","성명","name"]),
        dept:pick(o,["부서","팀","소속","dept","department"]),phone:pick(o,["연락처","전화번호","휴대폰","핸드폰","phone","mobile"])}))
        .filter(r=>r.empId&&r.name);
      if(!list.length)toast("error","명단을 읽지 못했어요. 사번·이름 열 확인.");
      else{ st.roster=list; db.ref(DBROOT+"/roster").set(list).catch(()=>{}); st.preNotify="scheduled"; renderOp(); toast("success","명단 "+list.length+"명 등록 · 안내문자 "+preNotifyTime()+" 예약됨."); }
    }catch(e){toast("error","파일 열기 실패. .xlsx 형식 확인.");}
    finally{ev.target.value="";}
  }
  function exportExcel(){
    if(!window.XLSX){toast("error","엑셀 모듈 로드 실패.");return;}
    try{
      const s=stats(), rows=opRows(), isTrain=st.eventType==="training";
      const data=rows.map(r=>{ const sub=r.uid?st.submissions[r.uid]:null;
        const o={사번:r.empId,이름:r.name,부서:r.dept,상태:r.checkInAt?(r.checkOutAt?"퇴실":(isTrain?"출석":"참석")):"미"+(isTrain?"출석":"참석"),출석시각:fmt(r.checkInAt)};
        if(isTrain)o.퇴실시각=fmt(r.checkOutAt);
        o.만족도=sub?sub.rating:"";
        o.참여소감=sub?(sub.comment||""):""; return o; });
      const ws=XLSX.utils.aoa_to_sheet([
        [curEvent.name],
        [curEvent.date+"  ·  "+curEvent.time+"  ·  "+curEvent.place],
        ["출결 현황  ·  참석 "+s.present+"/"+s.total+"명 ("+s.rate+"%)  ·  다운로드 "+downloadStamp()],
        []
      ]);
      XLSX.utils.sheet_add_json(ws, data, {origin:"A5"});
      const cols=Object.keys(data[0]||{}).length||6;
      ws["!merges"]=[
        {s:{r:0,c:0},e:{r:0,c:cols-1}},
        {s:{r:1,c:0},e:{r:1,c:cols-1}},
        {s:{r:2,c:0},e:{r:2,c:cols-1}}
      ];
      ws["!cols"]=Object.keys(data[0]||{}).map(k=>({wch:k==="참여소감"?28:k==="사번"?10:k==="부서"?12:9}));
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"출결");
      const safe=(curEvent.name||"출결").replace(/[\\/:*?"<>|]/g,"").trim();
      XLSX.writeFile(wb,"출결_"+safe+".xlsx"); toast("success","엑셀을 내려받았어요.");
    }catch(e){toast("error","다운로드 실패.");}
  }
  function openSms(){
    const absentees=st.roster.filter(r=>!st.attendance[r.empId]);
    const msg="[{이름}]님, 「"+curEvent.name+"」 진행 중입니다. 아직 출석이 확인되지 않았어요. 강당 QR로 출석 부탁드립니다. - 출첵";
    const chips=absentees.slice(0,8).map(a=>'<span class="mr-chip">'+esc(a.name)+' · '+maskPhone(a.phone)+'</span>').join("")+(absentees.length>8?'<span class="mr-chip more">+'+(absentees.length-8)+'명</span>':"");
    const wrap=document.createElement("div"); wrap.className="modal-backdrop"; wrap.id="smsModal";
    wrap.innerHTML='<div class="modal"><div class="modal-head"><h3>'+ic("send")+' 미출석자 리마인드 문자</h3><button class="modal-x" id="smsClose">'+ic("x-circle")+'</button></div>'+
      '<div class="modal-body"><div class="modal-recip"><span class="mr-count">받는 사람 <strong>'+absentees.length+'명</strong></span><div class="mr-chips">'+chips+'</div></div>'+
      '<label class="modal-label">문자 내용 <span>· {이름} 자리에 각자 이름</span></label><textarea class="modal-textarea" id="smsText" rows="4">'+esc(msg)+'</textarea>'+
      '<div class="modal-preview"><span class="mp-label">미리보기</span><div class="mp-bubble" id="smsPrev">'+esc(msg.replace("{이름}",(absentees[0]&&absentees[0].name)||"홍길동"))+'</div></div></div>'+
      '<div class="modal-foot"><button class="btn ghost" id="smsCancel">취소</button><button class="btn warn" id="smsSend" '+(absentees.length?"":"disabled")+'>'+ic("send")+' '+absentees.length+'명에게 발송</button></div></div>';
    document.body.appendChild(wrap); refreshIcons();
    const close=()=>wrap.remove();
    wrap.addEventListener("click",e=>{if(e.target===wrap)close();});
    document.getElementById("smsClose").onclick=close; document.getElementById("smsCancel").onclick=close;
    document.getElementById("smsText").addEventListener("input",e=>{document.getElementById("smsPrev").textContent=e.target.value.replace("{이름}",(absentees[0]&&absentees[0].name)||"홍길동");});
    document.getElementById("smsSend").onclick=()=>{close();toast("success","미출석자 "+absentees.length+"명에게 리마인드 문자를 발송했어요.");};
  }

  function openEditEvent(){
    const e=Object.assign({}, curEvent);
    const wrap=document.createElement("div"); wrap.className="modal-backdrop"; wrap.id="evtModal";
    wrap.innerHTML='<div class="modal"><div class="modal-head"><h3>'+ic("pencil")+' 행사 정보 수정</h3><button class="modal-x" id="evtClose">'+ic("x-circle")+'</button></div>'+
      '<div class="modal-body">'+
      '<label class="modal-label">행사명</label><input class="modal-input" id="evtName" value="'+esc(e.name)+'" placeholder="예: 2026 로티홀미팅"/>'+
      '<label class="modal-label">날짜</label><input class="modal-input" id="evtDate" value="'+esc(e.date)+'" placeholder="예: 2026.08.06 (목)"/>'+
      '<label class="modal-label">시간</label><input class="modal-input" id="evtTime" value="'+esc(e.time)+'" placeholder="예: 10:00 – 12:00"/>'+
      '<label class="modal-label">장소</label><input class="modal-input" id="evtPlace" value="'+esc(e.place)+'" placeholder="예: 웰빙센터 4층 로티홀"/>'+
      '<p class="modal-hint">'+ic("info")+' 저장하면 QR 체크인 화면과 안내문자에도 자동 반영됩니다.</p></div>'+
      '<div class="modal-foot"><button class="btn ghost" id="evtCancel">취소</button><button class="btn primary" id="evtSave">'+ic("check")+' 저장</button></div></div>';
    document.body.appendChild(wrap); refreshIcons();
    const close=()=>wrap.remove();
    wrap.addEventListener("click",ev2=>{if(ev2.target===wrap)close();});
    document.getElementById("evtClose").onclick=close; document.getElementById("evtCancel").onclick=close;
    document.getElementById("evtSave").onclick=()=>{
      const v={ name:(document.getElementById("evtName").value||"").trim()||EV.name,
                date:(document.getElementById("evtDate").value||"").trim(),
                time:(document.getElementById("evtTime").value||"").trim(),
                place:(document.getElementById("evtPlace").value||"").trim() };
      db.ref(DBROOT+"/event").set(v).then(()=>{ curEvent=Object.assign({}, EV, v); renderOp(); close(); toast("success","행사 정보를 저장했어요."); })
        .catch(()=>{ toast("error","저장에 실패했어요. 네트워크를 확인해 주세요."); });
    };
  }

  function tick(){
    if(!configured)return;
    const now=Date.now(), sl=secondsLeft(now), win=windowOf(now);
    const num=document.getElementById("cdNum"), txt=document.getElementById("cdText"), ring=document.getElementById("cdRing");
    if(num){num.textContent=sl;num.style.color=sl<=5?"var(--expire)":"#fff";}
    if(txt)txt.textContent=sl+"초";
    const pl=document.getElementById("previewLink"); if(pl)pl.href=checkinUrl();
    if(ring){const RC=2*Math.PI*26,frac=Math.max(0,Math.min(1,sl/QR_INTERVAL));ring.setAttribute("stroke-dasharray",RC);ring.setAttribute("stroke-dashoffset",RC*(1-frac));ring.setAttribute("stroke",sl<=5?"var(--expire)":"var(--amber)");}
    if(win!==st.lastWindow){ st.lastWindow=win; publishLive(win); const frame=document.getElementById("qrFrame");
      if(frame)frame.innerHTML=realQrSvg(checkinUrl())+'<div class="qr-refresh">'+ic("refresh-cw")+' 새 코드</div>'; refreshIcons(); }
  }
  function publishLive(w){
    if(!configured)return;
    db.ref(DBROOT+"/live").set({ w:w, ts:Date.now() }).catch(()=>{});
  }

  renderOp();
  setInterval(tick,1000); tick();
}

/* ============================================================================
   체크인 앱 (관객 폰) — 구글 로그인 인증
   ========================================================================== */
function runCheckin(){
  const w=+params.get("w"), t=params.get("t"), mode=params.get("m")||"in", type=params.get("ty")||"training";
  const cs = { step:"init", user:null, name:"", sabun:"", gname:"", needName:false, err:null, result:null, submitted:null,
    task:{rating:0,comment:"",assignment:"",fileName:"",quiz:{}} };
  let rosterIds=new Set(), rosterMap={};
  function rosterArr(v){ return Array.isArray(v)?v:(v&&typeof v==="object"?Object.values(v):[]); }

  function tokenOkLive(live){
    const authentic = tokenCode(EVENTID+"|"+mode+"|"+w)===t;   // 토큰이 그 창의 진짜 토큰인지
    if(!authentic) return false;
    if(live && typeof live.w==="number"){
      const age = live.w - w;              // 운영자 기준 몇 창 전에 스캔했는지 (폰 시계 무관)
      return age >= -1 && age <= 8;         // 직후 ~ 약 2분 전까지 허용 (로그인 지연·재시도 여유)
    }
    const cur=windowOf(Date.now());        // 폴백: 운영자 live 정보가 없을 때만 폰 시계 사용
    return Math.abs(cur-w)<=8;
  }

  if(!configured){ cs.step="config"; render(); }
  else {
    Promise.all([ db.ref(DBROOT+"/event").once("value"), db.ref(DBROOT+"/live").once("value"), db.ref(DBROOT+"/roster").once("value") ])
      .then(([es,ls,rs])=>{ curEvent=Object.assign({}, EV, es.val()||{});
        rosterArr(rs.val()).forEach(x=>{ const id=String(x.empId||"").trim().toUpperCase(); if(id){ rosterIds.add(id); rosterMap[id]=x.name||""; } });
        cs.step = tokenOkLive(ls.val()) ? "auth" : "expired"; render(); })
      .catch(()=>{ cs.step = tokenOkLive(null) ? "auth" : "expired"; render(); });
  }

  function doLogin(){
    cs.err=null;
    const provider=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(res=>{
      cs.user=res.user; cs.name=res.user.displayName||""; cs.step="form"; render();
    }).catch(err=>{
      const c=err&&err.code;
      if(c==="auth/unauthorized-domain") cs.err="이 주소가 Firebase 승인 도메인에 등록되지 않았어요.";
      else if(c==="auth/operation-not-allowed") cs.err="구글 로그인이 사용 설정되어 있지 않아요.";
      else if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") cs.err="로그인 창이 닫혔어요. 다시 시도해 주세요.";
      else if(c==="auth/popup-blocked") cs.err="브라우저가 팝업을 차단했어요. 팝업 허용 후 다시 시도해 주세요.";
      else cs.err="로그인에 실패했어요. 다시 시도해 주세요. ("+(c||"오류")+")";
      cs.step="auth"; render();
    });
  }

  function render(){
    const app=document.getElementById("app"); let inner="";
    if(cs.step==="init"){
      inner='<div class="ci-card"><div class="ci-brand">'+ic("qr-code")+' 출첵</div><p class="ci-sub" style="margin-top:20px">'+ic("loader")+' 잠시만요...</p></div>';
    } else if(cs.step==="config"){
      inner='<div class="ci-card"><div class="ci-ic warn">'+ic("triangle-alert")+'</div><h2>설정이 필요해요</h2>'+
        '<p class="ci-sub">운영자가 Firebase 설정을 아직 넣지 않았어요.</p></div>';
    } else if(cs.step==="expired"){
      inner='<div class="ci-card"><div class="ci-ic expire">'+ic("timer-reset")+'</div><h2>만료된 QR이에요</h2>'+
        '<p class="ci-sub">보안을 위해 QR은 '+QR_INTERVAL+'초마다 바뀌어요. 강당 화면의 <b>최신 QR</b>을 다시 스캔해 주세요.</p>'+
        '<button class="pbtn subtle" onclick="location.reload()">'+ic("refresh-cw")+' 다시 시도</button></div>';
    } else if(cs.step==="auth"){
      inner='<div class="ci-card"><div class="ci-brand">'+ic("qr-code")+' 출첵</div>'+
        '<div class="mode-badge '+(mode==="in"?"mb-in":"mb-out")+'">'+(mode==="in"?ic("log-in"):ic("log-out"))+' '+(mode==="in"?"출석 체크":"퇴실 체크")+'</div>'+
        '<h2>'+esc(curEvent.name)+'</h2><p class="ci-sub">'+esc(curEvent.place)+' · '+esc(curEvent.time)+'</p>'+
        '<p class="ci-sub" style="margin-top:6px">대리출석 방지를 위해 <b>구글 로그인</b>으로 본인 확인이 필요해요.</p>'+
        (cs.err?'<div class="pnote err">'+ic("x-circle")+' '+esc(cs.err)+'</div>':"")+
        '<button class="google-btn" id="ciLogin">'+googleG()+'<span>Google 계정으로 로그인</span></button></div>';
    } else if(cs.step==="form"){
      inner='<div class="ci-card"><div class="ci-brand">'+ic("qr-code")+' 출첵</div>'+
        '<div class="mode-badge '+(mode==="in"?"mb-in":"mb-out")+'">'+(mode==="in"?ic("log-in"):ic("log-out"))+' '+(mode==="in"?"출석 체크":"퇴실 체크")+'</div>'+
        '<h2>'+esc(curEvent.name)+'</h2>'+
        '<div class="who-badge">'+ic("user-check")+' '+esc(cs.user?(cs.user.displayName||cs.user.email):cs.name)+' 님으로 로그인됨</div>'+
        '<div class="field"><label>'+ic("id-card")+' 사번</label><input id="ciSabun" value="'+esc(cs.sabun)+'" placeholder="예: 00000000 (8자리)"/>'+
          '<span class="field-hint">본인 사번(숫자)을 입력하세요</span></div>'+
        (cs.needName?'<div class="field"><label>'+ic("user")+' 이름</label><input id="ciName" value="'+esc(cs.gname)+'" placeholder="이름을 입력하세요"/>'+
          '<span class="field-hint">명단에 없는 사번이에요. 이름을 입력해 주세요.</span></div>':"")+
        (cs.err?'<div class="pnote err">'+ic("x-circle")+' '+esc(cs.err)+'</div>':"")+
        '<button class="pbtn '+(mode==="in"?"primary":"primary-out")+'" id="ciSubmit">'+(mode==="in"?ic("log-in")+" 출석하기":ic("log-out")+" 퇴실하기")+'</button></div>';
    } else if(cs.step==="task"){
      const tk=cs.task, isTrain=type==="training";
      const stars=[1,2,3,4,5].map(n=>'<button class="star '+(n<=tk.rating?"on":"")+'" data-star="'+n+'">'+ic("star")+'</button>').join("");
      const quizBlocks=QUIZ.map((q,i)=>{const sel=tk.quiz[i];return '<div class="quiz-q"><p>'+(i+1)+'. '+esc(q.q)+'</p><div class="ox">'+
        '<button class="ox-btn '+(sel===true?"on-o":"")+'" data-quiz="'+i+'" data-ans="1">O</button>'+
        '<button class="ox-btn '+(sel===false?"on-x":"")+'" data-quiz="'+i+'" data-ans="0">X</button></div></div>';}).join("");
      const quizDone=QUIZ.every((q,i)=>tk.quiz[i]!==undefined);
      const can=tk.rating>0;
      inner='<div class="ci-card task-step"><div class="task-banner">'+ic("check-circle-2")+' 퇴실 완료 · '+fmt(cs.result.at)+'</div>'+
        '<h2>참여해주셔서 감사합니다.</h2><p class="ci-sub">만족도와 참여소감을 남겨주세요</p>'+
        '<div class="task-card"><div class="tc-head">'+ic("smile")+' 만족도 <span class="req">필수</span></div><div class="stars">'+stars+'</div></div>'+
        '<div class="task-card"><div class="tc-head">'+ic("message-square")+' 참여소감 <span class="opt">선택</span></div>'+
          '<textarea class="task-input task-area" id="tkComment" rows="3" placeholder="오늘 미팅 참여소감을 남겨주세요">'+esc(tk.comment)+'</textarea></div>'+
        '<button class="pbtn primary" id="tkSubmit" '+(can?"":"disabled")+'>'+ic("send")+' 제출하기</button></div>';
    } else if(cs.step==="done"){
      const r=cs.result, sub=cs.submitted;
      inner='<div class="ci-card done-step"><div class="done-ic '+(r.mode==="in"?"d-in":"d-out")+'">'+ic("check-circle-2")+'</div>'+
        '<h2>'+(r.mode==="out"?"퇴실 완료!":(type==="training"?"출석 완료!":"참석 완료!"))+'</h2>'+
        '<div class="done-time">'+fmt(r.at)+'</div><div class="done-who">'+esc(cs.user?(cs.user.displayName||cs.user.email):cs.name)+' · '+esc(cs.sabun)+'</div>'+
        (sub?'<div class="done-sub">'+ic("check-circle-2")+' 소중한 의견 감사합니다 · 만족도 ★'+sub.rating+'</div>':"")+
        '<p class="ci-sub">운영자 화면에 실시간으로 반영됐어요. 창을 닫으셔도 됩니다.</p></div>';
    }
    app.innerHTML='<div class="checkin-wrap">'+inner+'</div>';
    wireCi(); refreshIcons();
  }

  function wireCi(){
    if(cs.step==="auth"){
      const lg=document.getElementById("ciLogin"); if(lg)lg.onclick=doLogin;
    } else if(cs.step==="form"){
      const sb=document.getElementById("ciSabun"); if(sb)sb.addEventListener("input",e=>cs.sabun=e.target.value.toUpperCase());
      const nm=document.getElementById("ciName"); if(nm)nm.addEventListener("input",e=>cs.gname=e.target.value);
      const btn=document.getElementById("ciSubmit"); if(btn)btn.onclick=submit;
    } else if(cs.step==="task"){
      document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{cs.task.rating=+b.dataset.star;render();});
      const cm=document.getElementById("tkComment"); if(cm)cm.addEventListener("input",e=>cs.task.comment=e.target.value);
      const asg=document.getElementById("tkAssign"); if(asg)asg.addEventListener("input",e=>cs.task.assignment=e.target.value);
      const fi=document.getElementById("tkFileInput");
      const fa=document.getElementById("tkFile");
      if(fa&&fi){ fa.onclick=()=>fi.click(); fi.onchange=()=>handleFile(fi.files&&fi.files[0]); }
      document.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>{cs.task.quiz[b.dataset.quiz]=(b.dataset.ans==="1");render();});
      const su=document.getElementById("tkSubmit"); if(su)su.onclick=submitTask;
    }
  }

  function submit(){
    cs.err=null;
    if(!cs.user){cs.err="구글 로그인이 필요해요.";cs.step="auth";return render();}
    const sabun=cs.sabun.trim().toUpperCase();
    if(!sabun){cs.err="사번을 입력해 주세요.";return render();}
    const inRoster=rosterIds.has(sabun);
    if(!inRoster){
      cs.needName=true;
      if(!(cs.gname||"").trim()){ cs.err="명단에 없는 사번이에요. 이름을 입력해 주세요."; return render(); }
    }
    const resolvedName = inRoster ? (rosterMap[sabun]||cs.user.displayName||cs.name||"")
                                  : (cs.gname||"").trim();
    const uid=cs.user.uid;
    const ref=db.ref(DBROOT+"/attendance/"+uid);
    ref.once("value").then(snap=>{
      const rec=snap.val();
      if(mode==="in"){
        if(rec&&rec.checkInAt){cs.err="이미 "+fmt(rec.checkInAt)+"에 출석하셨어요. 한 계정은 다시 출석할 수 없어요.";return render();}
        const entry={uid:uid,email:cs.user.email||"",name:resolvedName,guest:!inRoster,empId:sabun,checkInAt:Date.now(),checkOutAt:null};
        ref.set(entry).then(()=>{ cs.result={mode:"in",at:entry.checkInAt};
          cs.step=(type==="general")?"task":"done"; render(); });
      } else {
        if(!rec||!rec.checkInAt){cs.err="출석 기록이 없어요. 먼저 출석 QR로 체크인해 주세요.";return render();}
        if(rec.checkOutAt){cs.err="이미 "+fmt(rec.checkOutAt)+"에 퇴실하셨어요.";return render();}
        const upd={checkOutAt:Date.now(),empId:sabun}; if(!rec.name&&resolvedName)upd.name=resolvedName;
        ref.update(upd).then(()=>{ cs.result={mode:"out",at:Date.now()};
          cs.step=(type==="training")?"task":"done"; render(); });
      }
    }).catch(()=>{cs.err="네트워크 오류예요. 잠시 후 다시 시도해 주세요.";render();});
  }

  function handleFile(f){
    if(!f) return;
    cs.task.fileName=f.name; cs.task.uploaded=false; cs.task.uploadErr=false;
    if(DRIVE_UPLOAD_URL){
      cs.task.uploading=true; render();
      const reader=new FileReader();
      reader.onload=()=>{
        const b64=((reader.result||"")+"").split(",")[1]||"";
        const who=(cs.name||"익명")+"_"+(cs.sabun||"");
        fetch(DRIVE_UPLOAD_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify({filename:who+"_"+f.name,mimeType:f.type||"application/octet-stream",bytes:b64})})
          .then(()=>{cs.task.uploading=false;cs.task.uploaded=true;render();})
          .catch(()=>{cs.task.uploading=false;cs.task.uploadErr=true;render();});
      };
      reader.onerror=()=>{cs.task.uploading=false;cs.task.uploadErr=true;render();};
      reader.readAsDataURL(f);
    } else { render(); }
  }

  function submitTask(){
    const sub={rating:cs.task.rating,comment:cs.task.comment,
      assignment:"",fileName:"",quizScore:0,quizTotal:0};
    db.ref(DBROOT+"/submissions/"+cs.user.uid).set(sub).then(()=>{cs.submitted=sub;cs.step="done";render();})
      .catch(()=>{cs.submitted=sub;cs.step="done";render();});
  }
}
</script></body></html>
